<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 342 1044" width="342" height="1044" font-family="Noto Sans SC, PingFang SC, sans-serif">
  <!-- Phone layout of mechanism-ai-workflow.svg: same boxes, same words, stacked
       top-to-bottom so every label renders at its true 16 / 12 px on a 390px screen. -->
  <rect x="0" y="0" width="342" height="1044" fill="#FFFFFF"/>

  <defs>
    <marker id="arrowM5m" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L6.5,4 L0,7" fill="none" stroke="#1C1B17" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ========== 主脉连线：输入 → Schema → 人工审核；治理原则从右侧约束 Schema ========== -->
  <g stroke="#1C1B17" stroke-opacity="0.3" stroke-width="1.1" fill="none">
    <path d="M159,144 V176" marker-end="url(#arrowM5m)"/>
    <path d="M159,404 V436" marker-end="url(#arrowM5m)"/>
    <path d="M318,552 V298 Q318,290 310,290 H302" marker-end="url(#arrowM5m)"/>
  </g>

  <!-- ========== 01 四类输入 ========== -->
  <rect x="16" y="16" width="286" height="128" rx="8" fill="#FFFFFF" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="32" y="48" font-size="16" fill="#1C1B17">四类输入</text>
  <text x="32" y="70" font-size="12" fill="#6B6862">非结构化、片段化</text>
  <g font-size="12" fill="#6B6862">
    <text x="32" y="102">·</text><text x="46" y="102">甲方变更</text>
    <text x="164" y="102">·</text><text x="178" y="102">领导汇报要求</text>
    <text x="32" y="126">·</text><text x="46" y="126">内部会议纪要</text>
    <text x="164" y="126">·</text><text x="178" y="126">需求收集 / 文档</text>
  </g>

  <!-- ========== 02 同一套 Schema（模型介入，铺 cream） ========== -->
  <rect x="16" y="176" width="286" height="228" rx="8" fill="#F2EFE9" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="32" y="208" font-size="16" fill="#1C1B17">同一套 Schema A–E</text>
  <text x="32" y="230" font-size="12" fill="#6B6862">结构一致，按场景差异化扩展</text>
  <g font-size="12" fill="#6B6862">
    <text x="32" y="266" font-family="Geist Mono, ui-monospace, monospace">A</text><text x="50" y="266">汇报摘要 Executive Summary</text>
    <text x="32" y="294" font-family="Geist Mono, ui-monospace, monospace">B</text><text x="50" y="294">可追踪任务表 Task Table</text>
    <text x="32" y="322" font-family="Geist Mono, ui-monospace, monospace">C</text><text x="50" y="322">风险与对策 Risks &amp; Mitigations</text>
    <text x="32" y="350" font-family="Geist Mono, ui-monospace, monospace">D</text><text x="50" y="350">待确认问题 Open Questions</text>
    <text x="32" y="378" font-family="Geist Mono, ui-monospace, monospace">E</text><text x="50" y="378">假设与溯源 Assumptions &amp; Source</text>
  </g>

  <!-- ========== 03 人工审核（全图唯一 terracotta） ========== -->
  <rect x="16" y="436" width="286" height="76" rx="8" fill="#B85C38" fill-opacity="0.1" stroke="#B85C38" stroke-width="1.5"/>
  <text x="32" y="468" font-size="16" font-weight="700" fill="#B85C38">人工审核</text>
  <text x="32" y="494" font-size="12" fill="#B85C38" fill-opacity="0.85">对外沟通前必须经过</text>

  <!-- ========== 治理原则（约束层） ========== -->
  <rect x="16" y="552" width="310" height="476" rx="8" fill="#FFFFFF" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="32" y="584" font-size="16" fill="#1C1B17">治理原则</text>
  <text x="32" y="606" font-size="12" fill="#6B6862">六条硬规则，约束生成与发出</text>
  <g font-size="12" fill="#6B6862">
    <text x="32" y="642">·</text><text x="46" y="642">不编造缺失信息</text><text x="46" y="660">No fabrication of missing facts, dates,</text><text x="46" y="678">owners, or decisions</text>
    <text x="32" y="708">·</text><text x="46" y="708">未知信息显性化</text><text x="46" y="726">Unknowns go into Open Questions /</text><text x="46" y="744">Assumptions, never hidden in Notes</text>
    <text x="32" y="774">·</text><text x="46" y="774">原句溯源</text><text x="46" y="792">Important interpretations link back</text><text x="46" y="810">to source quotes</text>
    <text x="32" y="840">·</text><text x="46" y="840">字段规范</text><text x="46" y="858">Due field is date-only or blank;</text><text x="46" y="876">Priority uses only P0–P3; no relative time</text>
    <text x="32" y="906">·</text><text x="46" y="906">已知与未知分离</text><text x="46" y="924">Known execution data and unresolved</text><text x="46" y="942">questions stay separate</text>
    <text x="32" y="972">·</text><text x="46" y="972">对外使用前必须人工审核</text><text x="46" y="990">Human review required before any</text><text x="46" y="1008">external-facing communication</text>
  </g>

</svg>
