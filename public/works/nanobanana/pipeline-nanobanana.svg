<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 612" width="880" height="612" font-family="Noto Sans SC, PingFang SC, sans-serif">

  <rect x="0" y="0" width="880" height="612" fill="#FFFFFF"/>

  <defs>
    <marker id="arrowN5" viewBox="0 0 8 8" refX="6.5" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L6.5,4 L0,7" fill="none" stroke="#1C1B17" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ========== 左侧贯穿竖轨：Round / State 管理（全图唯一 terracotta） ========== -->
  <rect x="40" y="40" width="44" height="412" rx="8" fill="#B85C38" fill-opacity="0.1" stroke="#B85C38" stroke-width="1.5"/>
  <text x="69" y="246" font-size="16" font-weight="700" fill="#B85C38" text-anchor="middle" transform="rotate(-90 69 246)">Round / State 管理</text>

  <!-- 竖轨接入各站 -->
  <g stroke="#1C1B17" stroke-opacity="0.3" stroke-width="1.1" fill="none">
    <path d="M84,71 H140"/>
    <path d="M84,161 H140"/>
    <path d="M84,264 H140"/>
    <path d="M84,421 H140"/>
  </g>

  <!-- ========== 主脉连线 ========== -->
  <g stroke="#1C1B17" stroke-opacity="0.3" stroke-width="1.1" fill="none">
    <path d="M250,102 V130" marker-end="url(#arrowN5)"/>
    <path d="M250,192 V220" marker-end="url(#arrowN5)"/>
  </g>

  <!-- 省略号：Stage 2 与 Stage X 之间，居中，无箭头 -->
  <g fill="#1C1B17" fill-opacity="0.35">
    <circle cx="250" cy="333" r="2.5"/>
    <circle cx="250" cy="349" r="2.5"/>
    <circle cx="250" cy="365" r="2.5"/>
  </g>

  <!-- ========== 01 白模主图输入 ========== -->
  <rect x="140" y="40" width="220" height="62" rx="8" fill="#FFFFFF" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="250" y="77" font-size="16" fill="#1C1B17" text-anchor="middle">白模主图输入</text>
  <g font-size="12" fill="#6B6862">
    <text x="392" y="62">·</text><text x="406" y="62">上传白模图或参考图</text>
    <text x="392" y="88">·</text><text x="406" y="88">作为整轮迭代的共同起点</text>
  </g>

  <!-- ========== 02 Stage 1（模型介入，铺 cream） ========== -->
  <rect x="140" y="130" width="220" height="62" rx="8" fill="#F2EFE9" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="250" y="167" font-size="16" fill="#1C1B17" text-anchor="middle">Stage 1 · 白模锁几何</text>
  <g font-size="12" fill="#6B6862">
    <text x="392" y="152">·</text><text x="406" y="152">锁定体量 / 建筑数量 / 主机位</text>
    <text x="392" y="178">·</text><text x="406" y="178">首轮同时确立整张图的基调</text>
  </g>

  <!-- ========== 03 Stage 2（模型介入，铺 cream） ========== -->
  <rect x="140" y="220" width="220" height="88" rx="8" fill="#F2EFE9" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="250" y="270" font-size="16" fill="#1C1B17" text-anchor="middle">Stage 2 · 反馈推进</text>
  <g font-size="12" fill="#6B6862">
    <text x="392" y="242">·</text><text x="406" y="242">每轮基于上一轮图像 + feedback case 继续生成</text>
    <text x="392" y="268">·</text><text x="406" y="268">在既定基调上推进人物 / 天气 / 环境</text>
    <text x="392" y="294">·</text><text x="406" y="294">结构化 feedback：keep / fix / avoid</text>
  </g>

  <!-- ========== 04 Stage X（多轮延续） ========== -->
  <rect x="140" y="390" width="220" height="62" rx="8" fill="#F2EFE9" stroke="#1C1B17" stroke-opacity="0.15"/>
  <text x="250" y="427" font-size="16" fill="#1C1B17" text-anchor="middle">Stage X · 持续推进</text>
  <g font-size="12" fill="#6B6862">
    <text x="392" y="412">·</text><text x="406" y="412">沿用 Stage 2 的方式逐轮迭代</text>
    <text x="392" y="438">·</text><text x="406" y="438">是否继续下一轮由人判断</text>
  </g>

  <!-- ========== 竖轨说明（自轨底引出） ========== -->
  <g stroke="#1C1B17" stroke-opacity="0.3" stroke-width="1.1" fill="none">
    <path d="M62,452 V486 Q62,494 70,494 H390"/>
  </g>

  <text x="406" y="498" font-family="Geist Mono, ui-monospace, monospace" font-size="12" fill="#6B6862" letter-spacing="0.1em">ROUND / STATE</text>
  <g font-size="12" fill="#6B6862">
    <text x="392" y="524">·</text><text x="406" y="524">逐轮记录 project_id / round / prompt</text>
    <text x="392" y="550">·</text><text x="406" y="550">以及 feedback / output / history</text>
    <text x="392" y="576">·</text><text x="406" y="576">不分阶段，每一轮都留痕</text>
  </g>

</svg>
